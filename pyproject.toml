[project]
name = "resilient-downloader"
version = "0.2.0"
description = "Advanced Modular Download Manager with Net-Merge (Multi-Interface Socket Binding) and CNL2 Support"
authors = [{ name = "Resilient Heisenberg" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "flet>=1.0.5",
    "flet-desktop>=1.0.5",
    "pystray>=0.19.5",
    "pyperclip>=1.11.0",
    "Pillow>=10.0.0",
    "libtorrent>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
