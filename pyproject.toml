[project]
name = "resilient-downloader"
version = "0.2.0"
description = "Advanced Modular Download Manager with Net-Merge (Multi-Interface Socket Binding) and CNL2 Support"
authors = [{ name = "Resilient Heisenberg" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "libtorrent>=2.0.0",
    "curl_cffi>=0.7.0",
    "quickjs>=1.19.4",
    "beautifulsoup4>=4.12.0",
    "dukpy>=0.4.0",
    "yt-dlp>=2024.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
    "flet>=1.0.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
